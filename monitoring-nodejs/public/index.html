<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система мониторинга серверов — МЦТ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .metric-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #1e293b;
        }
        .terminal-window {
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            max-height: 280px;
            overflow-y: auto;
            padding: 15px;
        }
        .terminal-header {
            background-color: #1e293b;
            padding: 8px 15px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border: 1px solid #334155;
            border-bottom: none;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .log-line {
            margin-bottom: 4px;
            border-bottom: 1px solid #0f172a;
            padding-bottom: 2px;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
        }
    </style>
</head>
<body class="py-4">

<div class="container">
    <!-- Шапка дашборда -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <div>
            <h2 class="fw-bold text-white mb-0">Мониторинг интегрированных систем</h2>
            <p class="text-secondary mb-0">Минская центральная таможня — Отдел разработки интегрированных систем</p>
        </div>
        <div class="text-end">
            <span class="badge bg-success status-badge mb-1">● Агент Python подключен</span>
            <div class="text-secondary small" id="last-update">Обновление: —</div>
        </div>
    </div>

    <!-- Раздел с графиками -->
    <h5 class="fw-bold mb-3 text-info"> Состояние веб-сервисов</h5>
    <div id="cards-container" class="row mb-5">
        <!-- Карточки с графиками подгружаются динамически -->
    </div>

    <!-- Раздел системных логов -->
    <div class="row">
        <div class="col-12">
            <h5 class="fw-bold mb-2 text-info"> Журнал событий</h5>
            <div class="terminal-header d-flex justify-content-between">
                <span>SYSTEM LOGS — server_metrics</span>
                <span>ПОСЛЕДНИЕ 1000 ЗАПИСЕЙ</span>
            </div>
            <div id="terminal-logs" class="terminal-window">
                <div class="text-secondary">Ожидание данных от сервера...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const chartInstances = {};

    async function updateDashboard() {
        try {
            const response = await fetch('/api/metrics');
            if (!response.ok) return;

            const data = await response.json();
            const container = document.getElementById('cards-container');
            const logsWindow = document.getElementById('terminal-logs');

            // 1. Отрисовка графиков и метрик
            data.services.forEach((service, index) => {
                let cardElement = document.getElementById(`service-card-${index}`);

                // Создаем карточку, если её еще нет на странице
                if (!cardElement) {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 mb-4';
                    col.id = `service-card-${index}`;
                    col.innerHTML = `
                        <div class="card card-custom p-3 h-100">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="fw-bold text-white mb-0">${service.name}</h6>
                                    <small class="text-secondary d-block text-truncate" style="max-width: 200px;">${service.url}</small>
                                </div>
                                <span id="status-badge-${index}" class="badge ${service.current_status === 1 ? 'bg-success' : 'bg-danger'} status-badge">
                                    ${service.current_status === 1 ? 'ONLINE' : 'OFFLINE'}
                                </span>
                            </div>

                            <div class="row text-center my-3 g-2">
                                <div class="col-6">
                                    <div class="metric-box">
                                        <small class="text-secondary d-block">Uptime</small>
                                        <span id="uptime-${index}" class="fs-6 fw-bold text-light">${service.uptime}%</span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="metric-box">
                                        <small class="text-secondary d-block">Avg Latency</small>
                                        <span id="latency-${index}" class="fs-6 fw-bold text-light">${service.avg_latency} мс</span>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-auto">
                                <canvas id="chart-${index}" height="140"></canvas>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);

                    // Инициализируем график Chart.js
                    const ctx = document.getElementById(`chart-${index}`).getContext('2d');
                    chartInstances[index] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: service.labels,
                            datasets: [{
                                label: 'Latency (мс)',
                                data: service.latencies,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 2,
                                pointRadius: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { display: false },
                                y: {
                                    grid: { color: '#334155' },
                                    ticks: { color: '#94a3b8', font: { size: 10 } }
                                }
                            }
                        }
                    });
                } else {
                    // Обновляем показатели и данные графика без перезагрузки
                    document.getElementById(`uptime-${index}`).innerText = `${service.uptime}%`;
                    document.getElementById(`latency-${index}`).innerText = `${service.avg_latency} мс`;
                    
                    const badge = document.getElementById(`status-badge-${index}`);
                    badge.className = `badge ${service.current_status === 1 ? 'bg-success' : 'bg-danger'} status-badge`;
                    badge.innerText = service.current_status === 1 ? 'ONLINE' : 'OFFLINE';

                    chartInstances[index].data.labels = service.labels;
                    chartInstances[index].data.datasets[0].data = service.latencies;
                    chartInstances[index].update();
                }
            });

            // 2. Отрисовка журнала логов
            logsWindow.innerHTML = '';
            data.logs.forEach(log => {
                const timeStr = new Date(log.created_at).toLocaleTimeString('ru-RU');
                const statusColor = log.is_available === 1 ? '#4ade80' : '#f87171';
                const statusText = log.is_available === 1 ? '200 OK' : `ERR ${log.status_code || '500'}`;

                const logLine = document.createElement('div');
                logLine.className = 'log-line';
                logLine.innerHTML = `
                    <span class="text-secondary">[${timeStr}]</span> 
                    <span style="color: ${statusColor}; font-weight: bold;">[${statusText}]</span> 
                    <span class="text-light">Сервис: <b>${log.service_name}</b></span> | 
                    <span class="text-secondary">Отклик: ${log.response_time_ms} мс</span>
                `;
                logsWindow.appendChild(logLine);
            });

            document.getElementById('last-update').innerText = `Обновление: ${new Date().toLocaleTimeString('ru-RU')}`;

        } catch (err) {
            console.error('Ошибка обновления интерфейса:', err);
        }
    }

    // Первичная загрузка и автообновление каждые 3 секунды
    updateDashboard();
    setInterval(updateDashboard, 3000);
</script>

</body>
</html>
